<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="notificationbanner" class="notificationbanner">
        <span> System maintenance scheduled for tonight. Website will be temporarily closed </span>
        <button id="close-notif-banner" class="close-notif-banner">&times;</button>
    </div>
    <header>
        <h1>StudentHub Portal</h1>
    </header>

    <main>
        <section>
            <h2>User Login</h2>
            <form action="#" method="post">
                <p>
                    <label for="username">Username / Email:</label><br>
                    <input type="text" id="username" name="username" required>
                </p>
                <p>
                    <label for="password">Password:</label><br>
                    <input type="password" id="password" name="password" required>
                </p>
                <p>
                    <label for="role">User Role:</label><br>
                    <select id="role" name="role">
                        <option value="student">Student</option>
                        <option value="faculty">Faculty</option>
                        <option value="admin">Admin</option>
                    </select>
                </p>
                <button type="submit">Sign In</button>
            </form>
        </section>
    </main>

    <nav aria-label="Main Navigation">
        <h3>Navigation</h3>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="student.html">Dashboard</a></li>
            <button id="toggletheme" class="btntoggle">Toggle Theme</button>
        </ul>
    </nav>

    <footer>
        <p>&copy; 2026 StudentHub - FTE Charusat. All rights reserved.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/scipt.js"></script>
</body>
</html>
