<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 13 - Fetch API CRUD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <div class="container my-5">
        <h2 class="mb-4 text-center">Practical 13: Asynchronous Fetch-Based Student CRUD</h2>

        <!-- Status / Feedback Banner -->
        <div id="status-msg" class="alert d-none" role="alert"></div>

        <!-- Add / Edit Form Card -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0" id="form-title">Add New Student</h4>
            </div>
            <div class="card-body">
                <form id="student-crud-form">
                    <input type="hidden" id="crud-student-id" value="">
                    
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label font-weight-bold">Name</label>
                            <input type="text" id="crud-name" class="form-control" placeholder="Full Name" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label font-weight-bold">Email</label>
                            <input type="email" id="crud-email" class="form-control" placeholder="name@gmail.com" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label font-weight-bold">Course</label>
                            <select id="crud-course" class="form-select" required>
                                <option value="">Select Course</option>
                                <option value="CSE">CSE</option>
                                <option value="IT">IT</option>
                                <option value="ECE">ECE</option>
                                <option value="Civil">Civil</option>
                                <option value="Mechanical">Mechanical</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-3 d-none" id="status-select-container">
                        <label class="form-label font-weight-bold">Status</label>
                        <select id="crud-status" class="form-select w-auto">
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>

                    <div class="mt-3">
                        <button type="submit" id="crud-submit-btn" class="btn btn-success">Add Student</button>
                        <button type="button" id="crud-cancel-btn" class="btn btn-secondary d-none">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Student Records Table Card -->
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Student Records</h4>
                <button class="btn btn-sm btn-outline-light" onclick="fetchStudents()">Refresh List</button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-bordered mb-0">
                        <thead class="table-primary">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Course</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="crud-table-body">
                            <!-- Rows loaded asynchronously -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Practical 13 CRUD Logic script -->
    <script src="js/crud.js"></script>
</body>
</html>
